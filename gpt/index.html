<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Viagem à Lua — Exploração Livre</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>body{margin:0;background:#050914;color:white;font-family:system-ui}#panel{position:fixed;top:12px;left:12px;z-index:5;background:#071326db;border:1px solid #60738b;border-radius:12px;padding:12px;max-width:290px}button{border:0;border-radius:8px;background:#dcecff;color:#102038;padding:9px;margin:3px;cursor:pointer;font-weight:600}#status{font-size:12px;color:#d4e1f5}#help{position:fixed;bottom:12px;left:12px;right:12px;text-align:center;z-index:3;pointer-events:none;font-size:13px;text-shadow:0 1px 4px #000} .small{font-size:12px}</style></head><body>
<div id="panel"><strong>🚀 Viagem à Lua</strong><div class="small">Exploração livre · sem limite de tempo</div><div><button id="sensors">Ativar sensores</button><button id="vr">Modo VR</button></div><div><button id="ship">Ir à nave</button><button id="base">Base lunar</button><button id="crater">Cratera</button><button id="earth">Vista da Terra</button></div><div id="status" aria-live="polite">Toque em um destino ou mire no marcador por 2 segundos.</div></div>
<div id="help">Celular: gire para olhar · Computador: arraste com mouse · Clique ou mire nos círculos azuis</div>
<a-scene background="color:#050713" renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:false">
<a-assets><a-mixin id="marker" geometry="primitive:torus;radius:0.65;radiusTubular:0.08" material="color:#55d8ff;emissive:#1775aa;side:double" animation="property:rotation;to:0 360 0;loop:true;dur:11000;easing:linear"></a-mixin></a-assets>
<a-entity light="type:ambient;color:#aeb6ce;intensity:0.9"></a-entity><a-entity light="type:directional;color:#fff5e5;intensity:1.6" position="-8 15 -6"></a-entity>
<a-sky color="#02040d"></a-sky>
<a-entity id="stars"></a-entity>
<a-plane rotation="-90 0 0" width="350" height="350" color="#85838a" material="roughness:1"></a-plane>
<a-entity id="terrain"></a-entity>
<!-- lunar lander -->
<a-entity position="0 0 -8"><a-cylinder position="0 2 0" radius="1.4" height="2.4" color="#b5b8c4"></a-cylinder><a-cone position="0 3.7 0" radius-bottom="1.4" radius-top="0.2" height="1.2" color="#d9dce3"></a-cone><a-cylinder position="0 0.8 0" radius="2.0" height="0.3" color="#b49a58"></a-cylinder><a-box position="0 1.8 1.39" width="0.8" height="1" depth="0.07" color="#121c32"></a-box>
<a-box position="1.7 0.9 1.7" width="0.14" height="2" depth="0.14" rotation="0 0 35" color="#d8cfaa"></a-box><a-box position="-1.7 0.9 1.7" width="0.14" height="2" depth="0.14" rotation="0 0 -35" color="#d8cfaa"></a-box><a-box position="1.7 0.9 -1.7" width="0.14" height="2" depth="0.14" rotation="0 0 35" color="#d8cfaa"></a-box><a-box position="-1.7 0.9 -1.7" width="0.14" height="2" depth="0.14" rotation="0 0 -35" color="#d8cfaa"></a-box><a-plane position="0 0.03 2.3" rotation="-90 0 0" width="1.4" height="3.4" color="#a29d86"></a-plane></a-entity>
<!-- Earth -->
<a-sphere position="-36 22 -82" radius="10" color="#2765c1" material="roughness:0.9"></a-sphere>
<a-sphere position="-41 24 -74" radius="3" color="#6ab66d" scale="1.5 0.7 0.12"></a-sphere><a-sphere position="-31 18 -74" radius="3.5" color="#6ab66d" scale="0.7 1.2 0.12"></a-sphere>
<!-- craters -->
<a-torus position="15 0.16 -17" rotation="-90 0 0" radius="6" radius-tubular="0.7" color="#62616a"></a-torus><a-circle position="15 0.06 -17" rotation="-90 0 0" radius="5.4" color="#62616a"></a-circle>
<a-torus position="-19 0.12 -25" rotation="-90 0 0" radius="3.2" radius-tubular="0.45" color="#6d6b72"></a-torus>
<a-entity id="markers">
<a-entity class="hotspot" data-go="ship" position="3 1.7 -5" mixin="marker"><a-text value="NAVE" align="center" position="0 1.1 0" width="5" color="#fff"></a-text></a-entity>
<a-entity class="hotspot" data-go="crater" position="11 1.7 -12" mixin="marker"><a-text value="CRATERA" align="center" position="0 1.1 0" width="5" color="#fff"></a-text></a-entity>
<a-entity class="hotspot" data-go="earth" position="-11 1.7 -17" mixin="marker"><a-text value="TERRA" align="center" position="0 1.1 0" width="5" color="#fff"></a-text></a-entity>
<a-entity class="hotspot" data-go="base" position="-1 1.7 5" mixin="marker"><a-text value="BASE" align="center" position="0 1.1 0" width="5" color="#fff"></a-text></a-entity>
</a-entity>
<a-entity id="rig" position="0 0 5"><a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled:false" wasd-controls="enabled:false"><a-entity cursor="fuse:true;fuseTimeout:2000" raycaster="objects:.hotspot;far:35" position="0 0 -1" geometry="primitive:ring;radiusInner:0.014;radiusOuter:0.022" material="color:#e7f9ff;shader:flat" animation__enter="property:scale;startEvents:mouseenter;from:1 1 1;to:2 2 2;dur:2000" animation__leave="property:scale;startEvents:mouseleave;to:1 1 1;dur:100"></a-entity></a-camera></a-entity>
</a-scene>
<script>
const scene=document.querySelector('a-scene'), rig=document.querySelector('#rig'), status=document.querySelector('#status');
const destinations={ship:{pos:'3 0 -3',label:'Próximo à nave'},base:{pos:'0 0 5',label:'Base lunar'},crater:{pos:'10 0 -10',label:'Borda da cratera'},earth:{pos:'-11 0 -17',label:'Observatório da Terra'}};
function go(key){const d=destinations[key];if(!d)return;rig.setAttribute('position',d.pos);status.textContent='Destino: '+d.label+'. Olhe ao redor para explorar.'}
Object.keys(destinations).forEach(k=>document.querySelector('#'+k).addEventListener('click',()=>go(k)));
document.querySelectorAll('.hotspot').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
document.querySelector('#sensors').addEventListener('click',async()=>{
try{if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();status.textContent=p==='granted'?'Permissão concedida. Gire o aparelho para testar.':'Permissão de orientação não concedida.'}
else status.textContent='Sensores: tente girar o celular. A disponibilidade depende do navegador.'}
catch(e){status.textContent='Não foi possível ativar sensores: '+e.message}});
document.querySelector('#vr').addEventListener('click',()=>{status.textContent='Tentando entrar no modo VR. Se não funcionar no iPhone, use o modo de tela; suporte varia por navegador.';scene.enterVR().catch?.(()=>{status.textContent='Modo VR indisponível neste navegador.'})});
scene.addEventListener('loaded',()=>{
let s=137;function rand(){s=(s*16807)%2147483647;return s/2147483647}
const stars=document.querySelector('#stars'),terrain=document.querySelector('#terrain');
for(let i=0;i<210;i++){const theta=rand()*Math.PI*2, y=rand()*110+7,r=110;const star=document.createElement('a-sphere');star.setAttribute('radius',0.08+rand()*0.14);star.setAttribute('position',`${Math.cos(theta)*r} ${y} ${Math.sin(theta)*r}`);star.setAttribute('material','color:#dce7ff;shader:flat');stars.appendChild(star)}
for(let i=0;i<80;i++){let x=(rand()-.5)*120,z=(rand()-.5)*120;if(Math.abs(x)<5&&Math.abs(z+8)<6)continue;const rock=document.createElement('a-dodecahedron');rock.setAttribute('position',`${x} ${0.2+rand()*.4} ${z}`);rock.setAttribute('radius',0.3+rand()*0.8);rock.setAttribute('color',rand()>.5?'#77747a':'#a7a3a8');terrain.appendChild(rock)}
});
</script></body></html>
